<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>동아리 일정 — 효원다회(曉原茶會)</title>
<meta name="description" content="효원다회의 정기 모임, 찻자리, 행사 일정을 확인하세요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/common.css">
<style>
  /* =========================================================
     일정 — 먹녹 통일 · 풀와이드   v2
     v2 변경점
     ① 구 갈색 하드코딩 색 전면 제거 (A10)
     ② 오늘 표시가 '숫자 줄 전체 녹색 바'가 되던 문제 복구
     ③ 날짜 칸을 button 으로 바꾸고 키보드 이동 지원
     ④ 보조 글자 명암비 보정 (--fog-2 → --sumi)
     ========================================================= */

  .sch-wrap{width:100%;max-width:none;margin:0;padding:clamp(24px,3vw,56px) var(--pad) 70px}

  .sch-head{margin-bottom:clamp(26px,3vw,46px)}
  .sch-head .sec-no{margin-bottom:18px}
  .sch-head h1{font-family:var(--serif);font-weight:500;color:var(--ink);
    font-size:clamp(1.5rem,2.6vw,2.5rem);letter-spacing:.1em;line-height:1.5}
  .sch-head p{color:var(--sumi);font-size:.9rem;margin-top:14px;letter-spacing:.04em}

  .paper{background:var(--cream);border:1px solid var(--line);border-radius:0;
    box-shadow:none;padding:clamp(20px,2.6vw,46px)}

  .topbar{display:flex;justify-content:space-between;align-items:center;
    margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--line-2)}
  .ttl-wrap{display:flex;align-items:baseline;gap:14px;margin:0 auto;flex-wrap:wrap;
    justify-content:center}
  .m-num{font-family:var(--serif);font-size:clamp(2.2rem,3.4vw,3.4rem);
    font-weight:400;color:var(--jade);line-height:1;letter-spacing:.04em}
  .m-name{font-family:var(--serif);font-size:clamp(.9rem,1.1vw,1.1rem);font-weight:400;
    color:var(--sumi);letter-spacing:.3em;text-transform:uppercase;line-height:1}
  /* ★ --fog-2 는 크림 배경에서 흐렸습니다 */
  .y-txt{font-size:.74rem;color:var(--sumi);letter-spacing:.26em}
  .nav-btn{background:transparent;border:1px solid var(--line-2);width:42px;height:42px;
    border-radius:0;cursor:pointer;font-size:.9rem;color:var(--sumi);
    display:flex;align-items:center;justify-content:center;transition:all .25s;
    font-family:monospace;flex:none}
  .nav-btn:hover{background:var(--jade);color:var(--ivory);border-color:var(--jade)}
  .today-btn{background:none;border:1px solid var(--line-2);color:var(--sumi);border-radius:0;
    padding:7px 16px;font-size:.72rem;font-weight:500;letter-spacing:.14em;
    cursor:pointer;margin-left:10px;font-family:inherit}
  .today-btn:hover{background:var(--jade);color:var(--ivory);border-color:var(--jade)}

  .grid2{display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,24vw,420px);
    gap:clamp(22px,2.6vw,48px);align-items:start}
  .cal-body{border:1px solid var(--line-2);background:var(--cream)}
  .cgrid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
  .dname{font-size:.72rem;font-weight:500;color:var(--sumi);padding:13px 0;letter-spacing:.2em;
    border-bottom:1px solid var(--line-2);border-right:1px solid var(--line);
    background:var(--cream-2)}
  .dname:last-child{border-right:none}

  /* ★ button 으로 바뀌었으므로 기본 스타일을 지웁니다 */
  .day{aspect-ratio:1/.92;display:flex;flex-direction:column;cursor:pointer;
    background:var(--cream);font-family:inherit;color:inherit;
    border:none;border-bottom:1px solid var(--line);border-right:1px solid var(--line);
    padding:6px 7px;overflow:hidden;text-align:left;transition:background .18s}
  .day:nth-child(7n){border-right:none}
  .day:hover{background:var(--cream-2)}
  .day:focus-visible{outline:2px solid var(--jade);outline-offset:-2px;z-index:3}
  .day.empty{background:var(--cream-2);opacity:.45;cursor:default}
  .day.sel{background:var(--cream-3);outline:1px solid var(--jade);z-index:2}
  .num{font-weight:700;font-size:clamp(.8rem,.95vw,.95rem);color:var(--ink);line-height:1;
    text-align:left;margin-bottom:5px}
  .day.sun .num{color:var(--clay)}
  .day.sat .num{color:var(--jade)}

  /* 일정 라벨 */
  .bdg{font-family:var(--serif);font-size:clamp(.68rem,.8vw,.82rem);font-weight:500;
    line-height:1.45;letter-spacing:.02em;
    text-align:left;word-break:keep-all;overflow:hidden;
    color:var(--jade);border-left:2px solid var(--jade);padding-left:5px;margin-bottom:3px}
  .bdg.k-special{color:var(--clay);border-left-color:var(--clay)}
  .bdg.k-notice{color:var(--sumi);border-left-color:var(--line-2)}
  .bdg.k-closed{color:var(--sumi);border-left-color:var(--line);text-decoration:line-through}

  .panel{background:var(--cream);border:1px solid var(--line-2);border-top:2px solid var(--jade);
    padding:clamp(18px,2vw,30px);min-height:320px}
  .p-date{font-family:var(--serif);font-size:1.02rem;font-weight:500;color:var(--jade);
    letter-spacing:.08em;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--line)}
  .ev{margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
  .ev:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
  .ev h4{font-family:var(--serif);font-size:1rem;font-weight:500;
    color:var(--jade);letter-spacing:.04em;line-height:1.55;margin-bottom:6px}
  .ev .meta{font-size:.8rem;color:var(--sumi);letter-spacing:.04em;line-height:1.8}
  .ev .dsc{font-size:.86rem;color:var(--ink-2);margin-top:8px;line-height:1.9}
  .kind{display:inline-block;font-size:.64rem;font-weight:500;padding:3px 10px;border-radius:0;
    background:transparent;border:1px solid var(--line-2);color:var(--sumi);
    letter-spacing:.16em;margin-bottom:7px}

  /* ★ 하드코딩 색을 대신하는 공통 안내문 */
  .msg{color:var(--sumi);font-size:.9rem;line-height:1.9}

  /* 다가오는 일정 */
  .upcoming{margin-top:clamp(34px,4vw,60px)}
  .upcoming h3{font-family:var(--serif);font-size:1.08rem;font-weight:500;color:var(--ink);
    letter-spacing:.12em;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:baseline}
  .upcoming h3::after{content:'UPCOMING';font-family:inherit;font-size:.66rem;
    letter-spacing:.26em;color:var(--sumi);font-weight:400}
  .up-item{display:flex;gap:18px;align-items:flex-start;width:100%;
    background:transparent;border:none;border-bottom:1px solid var(--line);border-radius:0;
    padding:18px 0;margin:0;cursor:pointer;text-align:left;font-family:inherit;
    transition:padding-left .25s}
  .up-item:hover{padding-left:8px}
  .up-item:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
  .up-d{min-width:70px;text-align:left;background:transparent;border-radius:0;padding:0;
    font-family:var(--serif);flex:none}
  .up-d b{display:block;font-size:1.45rem;font-weight:500;color:var(--jade);line-height:1.15}
  .up-d span{font-size:.68rem;color:var(--sumi);letter-spacing:.18em}
  .up-t{font-family:var(--serif);font-weight:500;color:var(--ink);letter-spacing:.04em;
    line-height:1.6}
  .up-m{font-size:.84rem;color:var(--sumi);margin-top:4px}

    /* ★ 다가오는 일정 — 더 보기 */
  #up-more{display:none}
  #up-more.open{display:block}
  .up-toggle{width:100%;margin-top:14px;padding:13px;background:transparent;
    border:1px solid var(--line-2);border-radius:0;cursor:pointer;font-family:inherit;
    font-size:.76rem;letter-spacing:.18em;color:var(--sumi);
    display:flex;justify-content:center;align-items:center;gap:10px;transition:all .25s}
  .up-toggle:hover{background:var(--jade);color:var(--ivory);border-color:var(--jade)}
  .up-toggle i{font-style:normal;font-size:.8rem}

  /* =========================================================
     common.css 호환 보정 (이 페이지 안에서만)
     ① 오늘 표시 : 숫자 줄 전체가 아니라 '숫자 한 칸'만 칠합니다
     ② 요일 머리 일/토 색
     ========================================================= */
  body .sch-wrap .day.today .num{background:transparent !important;color:var(--ink-2) !important}
  body .sch-wrap .day.today .num span{
    background:var(--jade) !important;color:var(--ivory) !important;border-radius:0 !important;
    width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center}
  body .sch-wrap .day.today.sun .num span{background:var(--clay) !important}
  body .sch-wrap .dname.sun{color:var(--clay) !important}
  body .sch-wrap .dname.sat{color:var(--jade) !important}
    /* ★ B-3 : common.css 의 body .day .num{color:var(--ink-2)!important} 이
     .day.sat .num 을 덮습니다. 일요일만 보정돼 있고 토요일이 빠져 있었습니다. */
  body .sch-wrap .day .num{color:var(--ink) !important;font-weight:700 !important}
  body .sch-wrap .day.sun .num{color:var(--clay) !important}
  body .sch-wrap .bdg{font-weight:500 !important}
  body .sch-wrap .day.sat .num{color:var(--jade) !important}
  body .sch-wrap .up-item{background:transparent !important;border:none !important;
    border-bottom:1px solid var(--line) !important}
  body .sch-wrap .up-item:hover{background:transparent !important}
  body .sch-wrap .up-d{background:transparent !important}

  @media(max-width:1100px){ .grid2{grid-template-columns:1fr;gap:22px} }
  @media(max-width:768px){
    .sch-wrap{padding:16px 0 50px}
    .paper{padding:16px 10px;border-left:none;border-right:none}
    .sch-head{padding:0 20px}
    .day{aspect-ratio:1/1.12;padding:4px 5px}
    .num{font-size:clamp(.76rem,2.8vw,.88rem)}
    .bdg{font-size:clamp(.62rem,2.3vw,.72rem);padding-left:4px;border-left-width:2px}
    .m-num{font-size:2.2rem}
    .upcoming{padding:0 20px}
  }
  @media (prefers-reduced-motion:reduce){
    .day,.up-item{transition:none}
  }
</style>
</head>
<body data-page="schedule">

<div id="hw-header"></div>

<main>
  <div class="sch-wrap">
    <div class="sch-head">
      <div class="sec-no">01 &nbsp;/&nbsp; SCHEDULE</div>
      <h1>동아리 일정</h1>
      <p>날짜를 누르면 그 날의 상세 내용이 오른쪽에 나타납니다. 좌우 방향키로도 이동할 수 있습니다.</p>
    </div>

    <div class="paper">
      <div class="topbar">
        <button type="button" class="nav-btn" id="prevM" aria-label="이전 달">&lt;</button>
        <div class="ttl-wrap">
          <span class="m-num" id="mNum">01</span>
          <span class="m-name" id="mName">January</span>
          <span class="y-txt" id="yTxt">2026</span>
          <button type="button" class="today-btn" id="todayB">오늘</button>
        </div>
        <button type="button" class="nav-btn" id="nextM" aria-label="다음 달">&gt;</button>
      </div>

      <div class="grid2">
        <div class="cal-body">
          <div class="cgrid" aria-hidden="true">
            <div class="dname sun">일</div><div class="dname">월</div>
            <div class="dname">화</div><div class="dname">수</div><div class="dname">목</div>
            <div class="dname">금</div><div class="dname sat">토</div>
          </div>
          <div class="cgrid" id="days" role="grid" aria-label="월간 달력"></div>
        </div>

        <div class="panel">
          <div class="p-date" id="pDate">날짜를 선택해 주세요</div>
          <div id="pBody" aria-live="polite">
            <p class="msg">달력에서 날짜를 누르면 상세 일정이 표시됩니다.</p>
          </div>
        </div>
      </div>
    </div>

    <div class="upcoming">
      <h3>다가오는 일정</h3>
      <div id="up"><p class="msg">불러오는 중…</p></div>
    </div>
  </div>
</main>

<div id="hw-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/layout.js"></script>
<script>
const E = HW.esc;
const A = HW.escAttr || HW.esc;

const MN = ['January','February','March','April','May','June',
            'July','August','September','October','November','December'];
const KIND = { regular:['정기 모임','k-regular'], special:['특별 행사','k-special'],
               notice:['공지','k-notice'], closed:['휴무','k-closed'], normal:['',''] };
const kOf = k => KIND[k] || KIND.normal;

let SCH = [], MAP = {}, y = new Date().getFullYear(), m = new Date().getMonth(), sel = null;
const TODAY = HW.ymd(new Date());

/* timestamptz 여도 안전하게 날짜만 자릅니다 */
const dOnly = v => v ? String(v).slice(0,10) : '';

/* =========================================================
   1. 여러 날 일정을 날짜별로 펼치기
   ★ B12 : end_date 가 date 보다 빠르면 루프가 0회 돌아
     그 일정이 달력에서 아예 사라졌습니다. 단일 날짜로 보정합니다.
   ★ 잘못 입력된 end_date(예: 2099년)로 브라우저가 멈추지 않도록
     400일 상한을 둡니다.
   ========================================================= */
function buildMap(){
  MAP = {};
  SCH.forEach(s => {
    const start = dOnly(s.date);
    if(!start) return;
    let end = dOnly(s.end_date) || start;
    if(end < start) end = start;                 /* ← 핵심 보정 */

    const st = new Date(start + 'T00:00:00');
    const en = new Date(end   + 'T00:00:00');
    if(isNaN(st) || isNaN(en)) return;

    let guard = 0;
    for(let d = new Date(st); d <= en && guard < 400; d.setDate(d.getDate() + 1), guard++){
      (MAP[HW.ymd(d)] ||= []).push(s);
    }
  });
}

async function init(){
  try{ SCH = await HW.api.schedules(); }catch(e){ SCH = []; }
  buildMap();
  draw();
  pick(TODAY);
  drawUp();
}

function move(n){
  m += n;
  if(m > 11){ m = 0;  y++; }
  if(m < 0) { m = 11; y--; }
  draw();
}
function goToday(){
  const d = new Date();
  y = d.getFullYear(); m = d.getMonth();
  draw(); pick(TODAY);
}

/* =========================================================
   2. 달력 그리기
   ========================================================= */
function draw(){
  HW.qs('#mNum').textContent  = String(m + 1).padStart(2,'0');
  HW.qs('#mName').textContent = MN[m];
  HW.qs('#yTxt').textContent  = y;

  const first = new Date(y, m, 1).getDay();
  const last  = new Date(y, m + 1, 0).getDate();
  let h = '';

  for(let i = 0; i < first; i++)
    h += '<div class="day empty" aria-hidden="true"></div>';

  for(let d = 1; d <= last; d++){
    const key = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const w   = new Date(y, m, d).getDay();
    const ev  = MAP[key] || [];
    const cls = [
      'day',
      w === 0 ? 'sun' : (w === 6 ? 'sat' : ''),
      key === sel   ? 'sel'   : '',
      key === TODAY ? 'today' : ''
    ].filter(Boolean).join(' ');

    const label = `${y}년 ${m+1}월 ${d}일` + (ev.length ? `, 일정 ${ev.length}건` : '');

    h += `<button type="button" class="${cls}" data-d="${A(key)}"
                  role="gridcell" aria-label="${A(label)}"
                  aria-selected="${key === sel ? 'true' : 'false'}">
            <span class="num"><span>${d}</span></span>
            ${ev.map(e => `<span class="bdg ${A(kOf(e.kind)[1])}">${E(e.title)}</span>`).join('')}
          </button>`;
  }
  HW.qs('#days').innerHTML = h;
}

/* =========================================================
   3. 날짜 선택
   ★ 기존에는 pick() 이 draw() 를 불러 달력 전체를 다시 만들었습니다.
     이제 바뀐 칸만 class 를 토글합니다.
   ========================================================= */
function pick(key){
  sel = key;

  const grid = HW.qs('#days');
  const prev = grid.querySelector('.day.sel');
  if(prev){ prev.classList.remove('sel'); prev.setAttribute('aria-selected','false'); }
  const cur = grid.querySelector(`.day[data-d="${key}"]`);
  if(cur){ cur.classList.add('sel'); cur.setAttribute('aria-selected','true'); }

  HW.qs('#pDate').textContent = HW.korDate(key);

  const ev = MAP[key] || [], box = HW.qs('#pBody');
  if(!ev.length){
    box.innerHTML = '<p class="msg">등록된 일정이 없습니다.</p>';
    return;
  }
  box.innerHTML = ev.map(s => {
    const k  = kOf(s.kind)[0];
    const sd = dOnly(s.date), ed = dOnly(s.end_date);
    const span = (ed && ed !== sd && ed > sd) ? `${sd} ~ ${ed}` : '';
    const meta = [HW.hm(s.start_time), s.location].filter(Boolean).join(' · ');
    return `<div class="ev">
      ${k ? `<span class="kind">${E(k)}</span>` : ''}
      <h4>${E(s.title)}</h4>
      <div class="meta">${E(meta)}${span ? `<br>${E(span)}` : ''}</div>
      ${s.description ? `<div class="dsc">${HW.nl2br(s.description)}</div>` : ''}
    </div>`;
  }).join('');
}

/* =========================================================
   4. 다가오는 일정
   ★ date 가 null 인 행이 하나만 있어도
     a.date.localeCompare 에서 전체 스크립트가 멈췄습니다.
   ========================================================= */
/* ★ 다가오는 일정 — 4건만 보이고 나머지는 접어 둡니다 */
let UP_OPEN = false;

function upHtml(s){
  const key  = dOnly(s.date);
  const d    = new Date(key + 'T00:00:00');
  const ok   = !isNaN(d);
  const k    = kOf(s.kind)[0];
  const meta = [HW.hm(s.start_time), s.location].filter(Boolean).join(' · ');
  return `<button type="button" class="up-item" data-jump="${A(key)}">
    <span class="up-d">
      <b>${ok ? d.getDate() : '—'}</b>
      <span>${ok ? (d.getMonth() + 1) + '월' : ''}</span>
    </span>
    <span>
      ${k ? `<span class="kind">${E(k)}</span>` : ''}
      <span class="up-t" style="display:block">${E(s.title)}</span>
      ${meta ? `<span class="up-m" style="display:block">${E(meta)}</span>` : ''}
    </span></button>`;
}

function drawUp(){
  const box = HW.qs('#up');
  const rows = SCH
    .filter(s => {
      const sd = dOnly(s.date); if(!sd) return false;
      const ed = dOnly(s.end_date);
      return (ed && ed > sd ? ed : sd) >= TODAY;
    })
    .sort((a,b) => dOnly(a.date).localeCompare(dOnly(b.date)));

  if(!rows.length){
    box.innerHTML = '<p class="msg">예정된 일정이 없습니다.</p>';
    return;
  }

  const head = rows.slice(0, 4);          /* 기본 노출 4건 */
  const rest = rows.slice(4);

  box.innerHTML =
    head.map(upHtml).join('') +
    (rest.length
      ? `<div id="up-more" class="${UP_OPEN ? 'open' : ''}">${rest.map(upHtml).join('')}</div>
         <button type="button" class="up-toggle" id="up-toggle"
                 aria-expanded="${UP_OPEN ? 'true' : 'false'}" aria-controls="up-more">
           ${UP_OPEN ? '접기' : `일정 ${rest.length}건 더 보기`}
           <i aria-hidden="true">${UP_OPEN ? '－' : '＋'}</i>
         </button>`
      : '');
}

function jump(date){
  const d = new Date(date + 'T00:00:00');
  if(isNaN(d)) return;
  y = d.getFullYear(); m = d.getMonth();
  draw(); pick(date);
  const p = document.querySelector('.paper');
  if(p) p.scrollIntoView({ behavior:'smooth', block:'start' });
}

/* =========================================================
   5. 이벤트 (인라인 onclick 제거)
   ========================================================= */
HW.qs('#prevM').addEventListener('click', () => move(-1));
HW.qs('#nextM').addEventListener('click', () => move(1));
HW.qs('#todayB').addEventListener('click', goToday);

HW.qs('#days').addEventListener('click', e => {
  const b = e.target.closest('.day[data-d]');
  if(b) pick(b.dataset.d);
});

HW.qs('#up').addEventListener('click', e => {
  const t = e.target.closest('#up-toggle');
  if(t){ UP_OPEN = !UP_OPEN; drawUp(); return; }
  const b = e.target.closest('[data-jump]');
  if(b) jump(b.dataset.jump);
});

/* 방향키 이동 — 월 경계에서는 자동으로 달을 넘깁니다 */
HW.qs('#days').addEventListener('keydown', e => {
  const STEP = { ArrowLeft:-1, ArrowRight:1, ArrowUp:-7, ArrowDown:7 };
  const s = STEP[e.key];
  if(s === undefined) return;

  const cells = HW.qsa('.day[data-d]', HW.qs('#days'));
  const i = cells.indexOf(e.target.closest('.day[data-d]'));
  if(i < 0) return;
  e.preventDefault();

  const n = i + s;
  if(n >= 0 && n < cells.length){
    cells[n].focus();
    pick(cells[n].dataset.d);
    return;
  }
  /* 달 경계 */
  move(n < 0 ? -1 : 1);
  const next = HW.qsa('.day[data-d]', HW.qs('#days'));
  if(!next.length) return;
  const t = n < 0 ? next[next.length - 1] : next[0];
  t.focus(); pick(t.dataset.d);
});

init();
</script>
</body>
</html>
