<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이야기 — 효원다회(曉原茶會)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/common.css">
<style>
  .wrapn{max-width:820px;margin:0 auto;padding:clamp(26px,3vw,50px) var(--pad) clamp(60px,6vw,100px)}
  .crumb{font-size:.72rem;letter-spacing:.16em;margin-bottom:clamp(24px,2.6vw,42px)}
  .crumb a{color:var(--sumi);text-decoration:none;border-bottom:1px solid var(--line-2);padding-bottom:3px}
  .crumb a:hover{color:var(--jade);border-color:var(--jade)}

  /* 분류 뱃지 — 크림 배경이므로 먹색 계열을 씁니다 */
  .kd{display:inline-block;font-size:.62rem;letter-spacing:.2em;padding:4px 11px;
    border:1px solid var(--line-2);color:var(--sumi);margin-bottom:16px}
  .kd.free{border-color:var(--clay);color:var(--clay)}

  h1.t{font-family:var(--serif);font-size:clamp(1.4rem,2.3vw,2.1rem);font-weight:500;
    color:var(--ink);letter-spacing:.08em;line-height:1.55;margin-bottom:16px}
  .minfo{font-size:.74rem;letter-spacing:.14em;color:var(--sumi);padding-bottom:16px;
    border-bottom:1px solid var(--line);display:flex;gap:18px;flex-wrap:wrap}
  .hero{width:100%;max-height:400px;object-fit:cover;margin:clamp(24px,2.6vw,38px) 0;filter:saturate(.85)}
  .ct{font-size:1rem;color:var(--ink-2);line-height:2.15;padding:clamp(26px,3vw,44px) 0;
    border-bottom:1px solid var(--line);letter-spacing:.01em}

  .issuebox{display:flex;gap:16px;align-items:flex-start;background:var(--cream-2);
    border:1px solid var(--line);border-left:2px solid var(--jade);
    padding:clamp(16px,1.8vw,22px);margin-top:clamp(22px,2.4vw,34px)}
  .issuebox img{width:54px;height:74px;object-fit:cover;flex:none;filter:saturate(.82)}
  .issuebox .ib{font-size:.62rem;letter-spacing:.22em;color:var(--sumi)}
  .issuebox b{display:block;font-family:var(--serif);font-size:1rem;font-weight:500;
    color:var(--jade);letter-spacing:.06em;margin-top:6px}
  .issuebox p{font-size:.84rem;color:var(--ink-2);line-height:1.85;margin-top:6px}

  .navbtns{display:flex;justify-content:space-between;gap:1px;background:var(--line);
    border:1px solid var(--line);margin:clamp(28px,3vw,46px) 0 0}
  .navbtns a,.navbtns span{flex:1;min-width:0;background:var(--cream);padding:18px 20px;
    font-size:.82rem;letter-spacing:.06em;text-decoration:none;color:var(--ink-2);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:background .22s}
  .navbtns a:hover{background:var(--cream-2);color:var(--jade)}
  .navbtns span{color:var(--sumi)}
  .navbtns a:last-child,.navbtns span:last-child{text-align:right}

  .cm{margin-top:clamp(44px,5vw,78px)}
  .cm h3{font-family:var(--serif);font-size:1.08rem;font-weight:500;color:var(--ink);
    letter-spacing:.12em;padding-bottom:14px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:baseline;margin-bottom:0}
  .cm h3 span{font-size:.66rem;letter-spacing:.22em;color:var(--sumi)}
  .cbox{border-bottom:1px solid var(--line);padding:18px 0}
  .cbox .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
  .cbox b{font-family:var(--serif);font-size:.94rem;font-weight:500;color:var(--jade);letter-spacing:.04em}
  .cbox .dt{font-size:.72rem;letter-spacing:.1em;color:var(--sumi)}
  .cbox p{font-size:.92rem;color:var(--ink-2);line-height:1.95;white-space:pre-line}
  .cdel{background:none;border:none;font-size:.7rem;letter-spacing:.1em;color:var(--sumi);
    border-bottom:1px solid var(--line-2);cursor:pointer;padding:0 0 2px;margin-left:10px}
  .cdel:hover{color:var(--clay);border-color:var(--clay)}
  .cdel:disabled{opacity:.5;cursor:not-allowed}
  .cnodel{font-size:.7rem;letter-spacing:.1em;color:var(--sumi);margin-left:10px}

  .cform{border:1px solid var(--line);border-top:2px solid var(--jade);
    padding:clamp(18px,2vw,26px);margin-top:clamp(22px,2.4vw,34px);background:var(--cream)}
  .cform .r2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .cform input,.cform textarea{width:100%;padding:11px 0;border:none;
    border-bottom:1px solid var(--line-2);background:transparent;font-family:inherit;
    font-size:.92rem;color:var(--ink);outline:none;margin-bottom:14px}
  .cform textarea{border:1px solid var(--line-2);padding:12px 14px;line-height:1.9;resize:vertical}
  .cform input:focus,.cform textarea:focus{border-color:var(--jade)}
  .cform input::placeholder,.cform textarea::placeholder{color:#8b8878}
  .cform .hint{font-size:.74rem;color:var(--sumi);line-height:1.8;margin:-6px 0 14px}
  .cform .hint b{color:var(--ink)}
  .cform button{background:var(--jade);color:var(--ivory);border:1px solid var(--jade);
    padding:13px 28px;font-family:inherit;font-size:.82rem;letter-spacing:.16em;
    cursor:pointer;transition:all .25s}
  .cform button:hover{background:transparent;color:var(--jade)}
  /* ★ 기존 background:var(--fog-2) 는 어두운 바탕 + 어두운 글자로 안 보였습니다 */
  .cform button:disabled{background:var(--cream-3);border-color:var(--line-2);
    color:#7d7a6d;cursor:not-allowed}

  .msg{color:var(--sumi);font-size:.86rem}

  @media(max-width:768px){
    .cform .r2{grid-template-columns:1fr;gap:0}
    .navbtns{flex-direction:column}
    .navbtns a:last-child,.navbtns span:last-child{text-align:left}
  }
    /* ★ B-9 : .sr-only 가 정의돼 있지 않았고 hidden 때문에
     스크린리더도 읽지 못해 for 연결이 무의미했습니다. */
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body data-page="journal">

<div id="hw-header"></div>

<main>
  <div class="wrapn">
    <div class="crumb"><a href="journal.html">이야기 목록으로 돌아가기</a></div>
    <div id="post"><p class="msg">불러오는 중…</p></div>

    <div class="navbtns" id="navbtns"></div>

    <section class="cm">
      <h3>댓글<span id="cnum" aria-live="polite">00</span></h3>
      <div id="clist">
        <p class="msg" style="padding:18px 0">첫 댓글을 남겨보세요.</p>
      </div>

      <form class="cform" onsubmit="addComment(event)">
        <div class="r2">
          <label class="sr-only" for="cnick" >닉네임</label>
          <input id="cnick" maxlength="20" placeholder="닉네임 (미입력 시 익명)" autocomplete="nickname">
          <label class="sr-only" for="cpw" >삭제용 비밀번호</label>
          <input id="cpw" type="password" maxlength="30" minlength="4" required
                 autocomplete="new-password" placeholder="삭제용 비밀번호 (4자 이상) *">
        </div>
        <div class="hint">비밀번호는 <b>본인 댓글을 직접 지울 때</b> 쓰입니다. 분실 시 집행부에 요청해 주세요.</div>
        <label class="sr-only" for="ctext" >댓글 내용</label>
        <textarea id="ctext" rows="3" required placeholder="따뜻한 말 한마디를 남겨주세요."></textarea>
        <button type="submit" id="cbtn">댓글 등록</button>
      </form>
    </section>
  </div>
</main>

<div id="hw-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/layout.js"></script>
<script>
const E   = HW.esc;
const A   = HW.escAttr || HW.esc;
const PID = new URLSearchParams(location.search).get('id');
const KIND = { story:'이야기', news:'소식', article:'기고', essay:'수필', review:'서평', free:'자유', notice:'공지' };
const MSG  = t => `<p class="msg">${E(t)}</p>`;

/* =========================================================
   본문 조회 — 뷰 우선, 없으면 원본 테이블
   ★ B1 수정 : 뷰 쿼리가 '성공했지만 결과가 없을 때' 그대로 null 을 돌려주어
     아래 폴백 쿼리가 절대 실행되지 않았습니다.
     이제 '데이터가 있을 때만' 반환합니다.
   ========================================================= */
async function fetchPost(id){
  /* 1차 : 공개 뷰 */
  const v = await HW.sb.from('journal_public').select('*').eq('id', id).maybeSingle();
  if(!v.error && v.data) return v.data;          /* ← 핵심 수정 */

  /* 2차 : 원본 테이블 + 조인 */
  const r = await HW.sb.from('journal_posts')
        .select('*, journal_series(name), journal_issues(issue_no,title,cover_url,editor_note)')
        .eq('id', id).eq('status','published').maybeSingle();
  if(r.error || !r.data) return null;

  const d = r.data;
  d.series_name = d.journal_series ? d.journal_series.name        : null;
  d.issue_no    = d.journal_issues ? d.journal_issues.issue_no    : null;
  d.issue_title = d.journal_issues ? d.journal_issues.title       : null;
  d.issue_cover = d.journal_issues ? d.journal_issues.cover_url   : null;
  d.issue_note  = d.journal_issues ? d.journal_issues.editor_note : null;
  return d;
}

/* 이전·다음 글 목록 — 위와 같은 이유로 '빈 결과'도 폴백합니다 */
async function fetchList(){
  const v = await HW.sb.from('journal_public').select('id,title,published_at,created_at');
  let rows = (!v.error && v.data && v.data.length) ? v.data : null;

  if(!rows){
    const r = await HW.sb.from('journal_posts')
          .select('id,title,published_at,created_at').eq('status','published');
    if(r.error || !r.data) return [];
    rows = r.data;
  }
  return rows.sort((a,b) =>
    String(b.published_at||b.created_at||'').localeCompare(String(a.published_at||a.created_at||'')));
}

/* =========================================================
   렌더
   ========================================================= */
(async () => {
  if(!PID){ HW.qs('#post').innerHTML = MSG('잘못된 접근입니다.'); return; }

  const p = await fetchPost(PID);
  if(!p){
    HW.qs('#post').innerHTML = MSG('글을 찾을 수 없거나 아직 공개되지 않았습니다.');
    return;
  }
  document.title = `${p.title} — 효원다회`;

  const free = !p.kind || p.kind === 'free' || p.kind === '자유';
  const issueTxt = p.issue_no
    ? ` · ${p.series_name ? p.series_name + ' ' : ''}${p.issue_no}호`
    : (p.series_name ? ' · ' + p.series_name : '');

  const issueBox = p.issue_no ? `
    <div class="issuebox">
      ${p.issue_cover ? `<img src="${A(p.issue_cover)}" alt="" loading="lazy" onerror="this.remove()">` : ''}
      <div>
        <div class="ib">${E(p.series_name || '이야기')} &nbsp;·&nbsp; 제 ${E(p.issue_no)} 호</div>
        <b>${E(p.issue_title || p.issue_no + '호')}</b>
        ${p.issue_note ? `<p>${E(p.issue_note)}</p>` : ''}
      </div>
    </div>` : '';

  HW.qs('#post').innerHTML = `
    <span class="kd ${free?'free':''}">${E(KIND[p.kind] || p.kind || '자유')}${E(issueTxt)}</span>
    <h1 class="t">${E(p.title)}</h1>
    <div class="minfo">
      <span>글 ${E(p.author||'익명')}</span>
      <span>${E((p.published_at||p.created_at||'').slice(0,10))}</span>
      <span>조회 ${E(p.views||0)}</span>
    </div>
    ${p.image_url?`<img class="hero" src="${A(p.image_url)}" alt="${A(p.title)}" onerror="this.remove()">`:''}
    <div class="ct">${HW.nl2br(p.body||'')}</div>
    ${issueBox}`;

  /* 조회수는 실패해도 본문에 영향을 주지 않습니다 */
  try{ await HW.sb.rpc('bump_view', { pid: String(PID) }); }catch(e){}

  loadNav(p);
  loadComments();
})();

async function loadNav(p){
  const list = await fetchList();
  if(!list.length) return;
  const i = list.findIndex(x => String(x.id) === String(p.id));
  if(i < 0) return;
  const prev = list[i+1], next = list[i-1];
  HW.qs('#navbtns').innerHTML =
    (prev?`<a href="journal-post.html?id=${encodeURIComponent(prev.id)}">← ${E(prev.title)}</a>`
         :`<span>이전 글 없음</span>`) +
    (next?`<a href="journal-post.html?id=${encodeURIComponent(next.id)}">${E(next.title)} →</a>`
         :`<span>다음 글 없음</span>`);
}

/* =========================================================
   댓글
   ========================================================= */
async function fetchComments(){
  const v = await HW.sb.from('comments_public').select('*')
            .eq('post_id', PID).order('created_at',{ascending:true});
  if(!v.error && v.data) return v.data;

  const r = await HW.sb.from('journal_comments').select('*')
        .eq('post_id', PID).order('created_at',{ascending:true});
  if(r.error || !r.data) return [];
  return r.data.filter(c => !c.is_hidden)
               .map(c => ({ ...c, content: c.content ?? c.body, has_pw: !!c.pw_hash }));
}

async function loadComments(){
  const rows = await fetchComments();
  HW.qs('#cnum').textContent = String(rows.length).padStart(2,'0');

  if(!rows.length){
    HW.qs('#clist').innerHTML = '<p class="msg" style="padding:18px 0">첫 댓글을 남겨보세요.</p>';
    return;
  }

  HW.qs('#clist').innerHTML = rows.map(c=>{
    /* ★ 뷰에 has_pw 컬럼이 없으면 undefined → 삭제 버튼이 전부 사라지던 문제 보정 */
    const canDel = (c.has_pw === undefined) ? true : !!c.has_pw;
    return `<div class="cbox">
      <div class="top">
        <b>${E(c.nickname||'익명')}</b>
        <span>
          <span class="dt">${E((c.created_at||'').slice(0,16).replace('T',' '))}</span>
          ${canDel
            ? `<button type="button" class="cdel" data-id="${A(c.id)}">삭제</button>`
            : `<span class="cnodel" title="비밀번호 없이 작성된 댓글입니다">집행부 삭제</span>`}
        </span>
      </div>
      <p>${E(c.content ?? c.body ?? '')}</p>
    </div>`;
  }).join('');
}

HW.qs('#clist').addEventListener('click', async e => {
  const b = e.target.closest('.cdel'); if(!b) return;
  const pw = prompt('댓글 작성 시 입력한 비밀번호를 적어주세요');
  if(pw === null) return;

  b.disabled = true;
  try{
    HW.okMsg(await HW.api.deleteComment(b.dataset.id, pw));
    loadComments();                     /* 성공 : 목록을 다시 그립니다 */
  }catch(err){
    HW.errMsg(err);
    b.disabled = false;                 /* ★ 실패 시 버튼 복원 */
  }
});

async function addComment(e){
  e.preventDefault();
  const nick = HW.qs('#cnick').value.trim() || '익명';
  const text = HW.qs('#ctext').value.trim();
  const pw   = HW.qs('#cpw').value;
  if(!text) return;
  if(!pw || pw.length < 4) return HW.toast('비밀번호를 4자 이상으로 적어주세요','warn');

  const btn = HW.qs('#cbtn');
  btn.disabled = true; btn.textContent = '등록 중…';
  try{
    await HW.api.addComment(PID, nick, text, pw);
    HW.qs('#ctext').value = ''; HW.qs('#cpw').value = '';
    HW.okMsg('댓글이 등록되었습니다');
    loadComments();
  }catch(err){
    HW.errMsg(new Error('댓글 등록 실패 — ' + (err.message || '')));
  }
  btn.disabled = false; btn.textContent = '댓글 등록';
}
</script>
</body>
</html>
